name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_SUPABASE_URL: https://fpqwuqoxdcuxyfsgtcsw.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_cutCTpi3A7stvxyNbjhDWA_Sd6rT_g_
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Android Release APK (Gradle)
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://fpqwuqoxdcuxyfsgtcsw.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_cutCTpi3A7stvxyNbjhDWA_Sd6rT_g_
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload RevCrew APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: revcrew-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
